<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 1080 590" width="1080" height="590" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .b{fill:#fff;stroke:#222;stroke-width:1.5}
  .w{fill:none;stroke:#222;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#222;stroke:#222;stroke-width:1.5}
  .p{fill:#fff;stroke:#c00;stroke-width:1.2}
  .t{font-size:10px;fill:#222}
  .l{font-size:9px;fill:#222}
  .h{font-size:12px;font-weight:bold;fill:#222;text-anchor:middle}
  .d{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:3 3}
  .n{font-size:10px;fill:#1a5fb4;font-weight:bold}
  .net{fill:none;stroke:#1a5fb4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .pw{fill:none;stroke:#c2410c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .j{fill:#1a5fb4}
  .note{font-size:10px;fill:#555}
</style>
<defs>
  <g id="gnd"><path class="w" d="M-8 0H8M-5 4H5M-2 8H2"/></g>

  <g id="wemos_d1_mini">
    <rect class="b" x="40" y="0" width="100" height="180"/>
    <text class="h" x="90" y="-6">WEMOS D1 mini</text>
    <g class="w">
      <path d="M0 20H40M0 40H40M0 60H40M0 80H40M0 100H40M0 120H40"/>
      <path d="M140 20H180M140 40H180M140 60H180M140 80H180M140 100H180M140 120H180M140 140H180M140 160H180"/>
    </g>
    <g class="p"><circle cx="0" cy="20" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="0" cy="60" r="2.5"/><circle cx="0" cy="80" r="2.5"/><circle cx="0" cy="100" r="2.5"/><circle cx="0" cy="120" r="2.5"/>
    <circle cx="180" cy="20" r="2.5"/><circle cx="180" cy="40" r="2.5"/><circle cx="180" cy="60" r="2.5"/><circle cx="180" cy="80" r="2.5"/><circle cx="180" cy="100" r="2.5"/><circle cx="180" cy="120" r="2.5"/><circle cx="180" cy="140" r="2.5"/><circle cx="180" cy="160" r="2.5"/></g>
    <g class="t">
      <text x="46" y="23">5V</text><text x="46" y="43">3V3</text><text x="46" y="63">G</text><text x="46" y="83">RST</text><text x="46" y="103">A0</text><text x="46" y="123">D0</text>
      <text x="134" y="23" text-anchor="end">D1</text><text x="134" y="43" text-anchor="end">D2</text><text x="134" y="63" text-anchor="end">D3</text><text x="134" y="83" text-anchor="end">D4</text>
      <text x="134" y="103" text-anchor="end">D5</text><text x="134" y="123" text-anchor="end">D6</text><text x="134" y="143" text-anchor="end">D7</text><text x="134" y="163" text-anchor="end">D8</text>
    </g>
  </g>

  <g id="ssr">
    <rect class="b" x="0" y="0" width="100" height="100"/>
    <text class="h" x="50" y="-6">SSR 25 A</text>
    <path class="d" d="M50 8V92"/>
    <g class="w">
      <path d="M0 30H30V40M0 70H30V56"/>
      <path d="M20 40H40M20 56H40"/>
      <path d="M45 38l6 -6M45 46l6 -6"/>
      <path d="M100 30H70V42M100 70H70V60M70 42L80 58"/>
    </g>
    <path class="f" d="M20 40H40L30 56Z"/>
    <g class="p"><circle cx="0" cy="30" r="2.5"/><circle cx="0" cy="70" r="2.5"/><circle cx="100" cy="30" r="2.5"/><circle cx="100" cy="70" r="2.5"/></g>
    <g class="l"><text x="4" y="26">IN+</text><text x="4" y="86">IN-</text><text x="96" y="26" text-anchor="end">L1</text><text x="96" y="86" text-anchor="end">L2</text></g>
  </g>

  <g id="ds18b20">
    <rect class="b" x="40" y="0" width="80" height="80"/>
    <text class="h" x="80" y="-6">DS18B20</text>
    <g class="w"><path d="M0 20H40M0 40H40M0 60H40"/></g>
    <g class="p"><circle cx="0" cy="20" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="0" cy="60" r="2.5"/></g>
    <g class="t"><text x="46" y="23">VDD</text><text x="46" y="43">DQ</text><text x="46" y="63">GND</text></g>
    <text class="l" x="80" y="76" text-anchor="middle">1-Wire</text>
  </g>

  <g id="acdc_19v">
    <rect class="b" x="40" y="0" width="100" height="80"/>
    <text class="h" x="90" y="-6">AC/DC 19 V, 4.2 A</text>
    <path class="w" d="M62 58L114 26"/>
    <g class="w"><path d="M0 20H40M0 60H40M140 20H180M140 60H180"/></g>
    <g class="p"><circle cx="0" cy="20" r="2.5"/><circle cx="0" cy="60" r="2.5"/><circle cx="180" cy="20" r="2.5"/><circle cx="180" cy="60" r="2.5"/></g>
    <g class="t"><text x="52" y="40">AC</text><text x="106" y="62">DC</text></g>
    <g class="l"><text x="46" y="16">L</text><text x="46" y="76">N</text>
    <text x="134" y="16" text-anchor="end">+19V</text><text x="134" y="76" text-anchor="end">GND</text></g>
  </g>

  <g id="dcdc_5v">
    <rect class="b" x="40" y="0" width="100" height="80"/>
    <text class="h" x="90" y="-6">DC/DC 5 V</text>
    <path class="w" d="M62 58L114 26"/>
    <g class="w"><path d="M0 20H40M0 60H40M140 20H180M140 60H180"/></g>
    <g class="p"><circle cx="0" cy="20" r="2.5"/><circle cx="0" cy="60" r="2.5"/><circle cx="180" cy="20" r="2.5"/><circle cx="180" cy="60" r="2.5"/></g>
    <g class="t"><text x="52" y="40">DC</text><text x="106" y="62">DC</text></g>
    <g class="l"><text x="46" y="16">IN+</text><text x="46" y="76">GND</text>
    <text x="134" y="16" text-anchor="end">+5V</text><text x="134" y="76" text-anchor="end">GND</text></g>
  </g>

  <g id="fan_5v">
    <rect class="b" x="0" y="20" width="60" height="60" rx="6"/>
    <circle class="b" cx="30" cy="50" r="25"/>
    <g class="w">
      <path transform="rotate(0.0 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(51.4 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(102.9 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(154.3 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(205.7 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(257.1 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
      <path transform="rotate(308.6 30 50)" d="M32 44C36 32 46 28 52 36C46 36 40 40 36 48Z"/>
    </g>
    <circle class="b" cx="30" cy="50" r="6"/>
    <g class="w"><circle cx="7" cy="27" r="2.5"/><circle cx="53" cy="27" r="2.5"/><circle cx="7" cy="73" r="2.5"/><circle cx="53" cy="73" r="2.5"/>
    <path d="M30 0V20M30 80V100"/></g>
    <g class="p"><circle cx="30" cy="0" r="2.5"/><circle cx="30" cy="100" r="2.5"/></g>
    <g class="l"><text x="36" y="14">+</text><text x="36" y="96">-</text></g>
    <text class="t" x="68" y="54">5V fan</text>
  </g>

  <g id="res_v">
    <path class="w" d="M0 0V10M0 30V40"/><rect class="b" x="-4" y="10" width="8" height="20"/>
    <g class="p"><circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="40" r="2.5"/></g>
  </g>

  <g id="nmos_q">
    <g class="w">
      <path d="M0 30H14M14 10V50M20 10V18M20 26V34M20 42V50M20 14H36V0M20 46H36V60M20 30H36V46"/>
    </g>
    <path class="f" d="M30 30L24 27V33Z"/>
    <g class="p"><circle cx="0" cy="30" r="2.5"/><circle cx="36" cy="0" r="2.5"/><circle cx="36" cy="60" r="2.5"/></g>
  </g>

  <g id="nmos_module">
    <rect class="b" x="40" y="0" width="100" height="80"/>
    <text class="h" x="90" y="-6">N-MOSFET module</text>
    <g class="w">
      <path d="M0 20H40M0 60H40M140 20H180M140 60H180"/>
      <path d="M60 20H80M80 20V60M96 28V52M96 30H120V20H140M96 50H120V60H140M96 40H108M80 40H96"/>
    </g>
    <g class="p"><circle cx="0" cy="20" r="2.5"/><circle cx="0" cy="60" r="2.5"/><circle cx="180" cy="20" r="2.5"/><circle cx="180" cy="60" r="2.5"/></g>
    <g class="l"><text x="46" y="16">SIG</text><text x="46" y="76">GND</text><text x="134" y="16" text-anchor="end">D</text><text x="134" y="76" text-anchor="end">S</text></g>
  </g>

  <g id="dc_motor">
    <text class="t" x="62" y="54">Mixer motor</text>
    <circle class="b" cx="30" cy="50" r="25"/>
    <text class="h" x="30" y="55" style="font-size:16px">M</text>
    <g class="w">
      <path d="M30 0V25M30 100V75"/>
    </g>
    <g class="p"><circle cx="30" cy="0" r="2.5"/><circle cx="30" cy="100" r="2.5"/></g>
    <g class="l"><text x="36" y="12">M+</text><text x="36" y="96">M-</text></g>
  </g>
</defs>

<rect x="-70" y="0" width="1080" height="590" fill="#fff"/>

<!-- Symbols -->
<use href="#wemos_d1_mini" x="330" y="40"/>
<use href="#ds18b20" x="640" y="20"/>
<use href="#ssr" x="560" y="230"/>
<use href="#acdc_19v" x="20" y="330"/>
<use href="#res_v" x="480" y="350"/>
<use href="#res_v" x="370" y="390"/>
<use href="#nmos_q" x="444" y="430"/>
<use href="#nmos_q" x="580" y="490"/>
<use href="#dc_motor" x="620" y="380"/>

<!-- Wemos power pins -->
<use href="#dcdc_5v" x="20" y="40"/>
<path class="pw" d="M200 60H330"/><text class="n" x="240" y="54">5V</text>
<path class="net" d="M200 100H215V104"/><use href="#gnd" x="215" y="104"/>
<path class="net" d="M20 100H5V104"/><use href="#gnd" x="5" y="104"/>
<path class="pw" d="M250 350V300H-20V60H20"/>
<circle cx="250" cy="350" r="3" fill="#c2410c"/>
<path class="pw" d="M330 80H312"/><text class="n" x="308" y="83" text-anchor="end">3V3</text>
<path class="net" d="M330 100H310V104"/><use href="#gnd" x="310" y="104"/>

<!-- D1 -> DS18B20 DQ, 4.7k pull-up to 3V3 -->
<path class="net" d="M510 60H640"/>
<circle class="j" cx="580" cy="60" r="3"/>
<path class="net" d="M580 60V55M580 45V40H640"/>
<rect class="b" x="576" y="45" width="8" height="10"/>
<text class="l" x="588" y="54">4.7k</text>
<text class="n" x="600" y="34">3V3</text>
<path class="net" d="M640 80H620V84"/><use href="#gnd" x="620" y="84"/>

<!-- D2 -> SSR IN+, IN- to GND -->
<path class="net" d="M510 80H540V260H560"/>
<path class="net" d="M560 300H545V304"/><use href="#gnd" x="545" y="304"/>

<!-- SSR mains side + heater -->
<path class="pw" d="M660 260H700"/><text class="n" x="664" y="252">L (mains)</text>
<path class="pw" d="M660 300H700"/>
<g id="heater_pot">
  <rect class="b" x="696" y="278" width="8" height="6"/><rect class="b" x="756" y="278" width="8" height="6"/>
  <path class="b" d="M704 272H756V318Q756 326 748 326H712Q704 326 704 318Z"/>
  <rect class="b" x="702" y="266" width="56" height="6" rx="2"/><rect class="b" x="725" y="259" width="10" height="7" rx="2"/>
  <path class="w" d="M700 300H712L716 292L722 308L728 292L734 308L740 292L744 300H760"/>
  <text class="t" x="730" y="342" text-anchor="middle">Heater (pot)</text>
</g>
<path class="pw" d="M760 300H790"/><text class="n" x="794" y="304">N</text>

<!-- D5 -> MOSFET module SIG -->
<path class="net" d="M510 140H525V320H400V460H444"/>
<path class="net" d="M370 430H400"/><circle class="j" cx="400" cy="430" r="3"/>
<path class="pw" d="M370 390V386"/><text class="n" x="364" y="390" text-anchor="end">3V3</text>
<text class="l" x="378" y="414">10k</text>
<path class="net" d="M480 390V430"/>
<path class="net" d="M480 410H540V520H580"/><circle class="j" cx="480" cy="410" r="3"/>
<text class="l" x="488" y="374">10k</text>
<use href="#gnd" x="480" y="490"/>
<text class="t" x="492" y="450">Q1 (small-signal)</text>
<text class="t" x="632" y="518">Q2 IRFZ30</text>
<text class="h" x="330" y="570" style="text-anchor:start">Mixer driver (active-low)</text>

<!-- Mains into AC/DC -->
<path class="pw" d="M20 350H0"/><text class="n" x="-4" y="353" text-anchor="end">L (mains)</text>
<path class="pw" d="M20 390H0"/><text class="n" x="-4" y="393" text-anchor="end">N</text>

<!-- +19V to motor, GND -->
<path class="pw" d="M200 350H650V380"/>
<text class="n" x="360" y="344">+19V</text>
<path class="net" d="M200 390H230V394"/><use href="#gnd" x="230" y="394"/>

<!-- Motor M- -> MOSFET drain; source -> GND -->
<path class="pw" d="M650 480V490H616"/>
<use href="#gnd" x="616" y="550"/>

<!-- Cooler fan: D6 -> MOSFET module #2, fan on +5V -->
<use href="#nmos_module" x="700" y="130"/>
<use href="#fan_5v" x="900" y="50"/>
<path class="net" d="M510 160H680V150H700"/>
<path class="net" d="M700 190H685V194"/><use href="#gnd" x="685" y="194"/>
<path class="pw" d="M880 150H930V150"/>
<path class="net" d="M880 190V194"/><use href="#gnd" x="880" y="194"/>
<path class="pw" d="M270 60V2H930V50"/>
<circle cx="270" cy="60" r="3" fill="#c2410c"/>

<!-- Notes -->
</svg>
