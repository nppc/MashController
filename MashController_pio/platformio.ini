[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; DallasTemperature/OneWire and ArduinoJson aren't bundled with the
; framework - PlatformIO fetches them from its registry on first build.
; Pinned to ArduinoJson 6.x on purpose: this project uses the v6 API
; (StaticJsonDocument, createNestedArray/createNestedObject), which v7
; renamed/reworked.
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.6

; ESP8266WiFi, ESP8266WebServer, and LittleFS ship with the framework
; itself, so they don't need a lib_deps entry.

board_build.filesystem = littlefs

; Matches Arduino IDE's Tools > Flash Size: "4MB (FS:1MB OTA:~1019KB)".
; Naming pattern is eagle.flash.<total><fs_size>.ld - e.g. 4m2m would give
; a 2MB filesystem instead, on the same 4MB board.
board_build.ldscript = eagle.flash.4m1m.ld